<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trabajo 1 - Polimorfismo y Herencia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { padding: 12px; border: 1px solid #ccc; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<h1>Demostración de Polimorfismo - Tema: Jugar Video Juego</h1>
<p><strong>Estudiante:</strong> USUGA GALLEGO EMANUEL</p>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Tipo de Clase Concreta</th>
        <th>Método 1: Iniciar Juego</th>
        <th>Método 2: Realizar Partida</th>
        <th>Método 3: Terminar Juego</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="res, iterStat : ${resultados}">
        <td th:text="${iterStat.count}">1</td>
        <td th:text="${res.tipo}">Tipo</td>
        <td th:text="${res.mensajeInicio}">Inicio</td>
        <td th:text="${res.mensajePartida}">Partida</td>
        <td th:text="${res.mensajeFin}">Fin</td>
    </tr>
    </tbody>
</table>

</body>
</html>
